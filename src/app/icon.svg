<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>NeuroGecko</title>
  <defs>
    <linearGradient id="neurogecko-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="neurogecko-main" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="neurogecko-prism" x1="160" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <radialGradient id="neurogecko-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Obsidian & Brand-Tinted Squircle Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0a0a0d" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#neurogecko-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#neurogecko-main)" stroke-width="16" stroke-opacity="0.95" />

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="216" fill="url(#neurogecko-glow)" />

  <!-- Semiotic Viewfinder Corner Brackets -->
  <path d="M86 134V102C86 93.163 93.163 86 102 86H134" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 86H410C418.837 86 426 93.163 426 102V134" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M86 378V410C86 418.837 93.163 426 102 426H134" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 426H410C418.837 426 426 418.837 426 410V378" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Multi-Layer Bespoke Semiotic Geometry (1.06x Optical Presence Scale) -->
  <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
    <polygon points="256,122 372,189 372,323 256,390 140,323 140,189" stroke="url(#neurogecko-main)" stroke-width="12" stroke-linejoin="round" fill="none" opacity="0.35" />
    <line x1="256" y1="124" x2="256" y2="388" stroke="url(#neurogecko-main)" stroke-width="18" stroke-linecap="round" />
    <line x1="142" y1="190" x2="370" y2="322" stroke="url(#neurogecko-main)" stroke-width="18" stroke-linecap="round" />
    <line x1="370" y1="190" x2="142" y2="322" stroke="url(#neurogecko-main)" stroke-width="18" stroke-linecap="round" />
    <circle cx="256" cy="124" r="18" fill="url(#neurogecko-main)" />
    <circle cx="256" cy="388" r="18" fill="url(#neurogecko-main)" />
    <circle cx="256" cy="256" r="62" fill="url(#neurogecko-prism)" />
    <rect x="244" y="222" width="24" height="68" rx="6" fill="#15803d" />
    <circle cx="256" cy="124" r="8" fill="#ffffff" />
  </g>
</svg>
